# SpecForge — independent verification in CI (R2).
#
# This job re-checks the SpecForge state on every PR: ledger integrity chain,
# artifact schemas, staleness, and trace drift. It is the layer that holds even
# if a local harness had its hooks disabled — CI runs on another machine, with
# another trust boundary.
#
# Scaffolded by `sf verify --init-ci`. Safe to edit.
name: SpecForge verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Install the sf CLI ──────────────────────────────────────────────
      # Adapt this step to how your project distributes `sf`:
      #   - a vendored binary:   tools/sf  (the default below)
      #   - a release download:  curl -L <release-url> -o /usr/local/bin/sf
      #   - from source:         go install <module>/cli@<version>
      - name: Install sf
        run: |
          if [ -x ./tools/sf ]; then
            echo "$PWD/tools" >> "$GITHUB_PATH"
          else
            echo "::error::no sf binary found — vendor it at tools/sf or adapt this step"
            exit 1
          fi

      - name: SpecForge verify
        run: sf verify

      # Spec coverage ratchet (F3): the % of code anchored to a live spec can
      # only go up. A drop fails the job — a deleted trace or a rename without
      # resync un-anchored code somewhere.
      - name: Spec coverage ratchet
        run: sf coverage
