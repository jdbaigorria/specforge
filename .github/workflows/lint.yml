name: lint-skills

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Lint skill suite
        run: python3 scripts/lint-skills.py
      - name: Enforcement engine self-test
        run: python3 hooks/specforge_enforce.py --selftest
      - name: Drift detector self-test
        run: python3 scripts/check-drift.py --selftest
      - name: Example stays drift-clean
        run: python3 scripts/check-drift.py examples/slugify
      - name: Project status renderer self-test
        run: python3 scripts/sf-status.py --selftest
