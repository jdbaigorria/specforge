name: ci

on:
  push:
  pull_request:

jobs:
  sf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.x"

      - name: Vet
        working-directory: sf
        run: go vet ./...

      - name: Test
        working-directory: sf
        run: go test ./...

      - name: Build
        working-directory: sf
        run: go build -o sf ./cmd/sf

      # El guion de humo: la maquina entera, por la superficie del binario.
      #
      # Va aparte de `go test ./...` porque compila y corre git, y porque los
      # tests de paquete NO LO REEMPLAZAN: la auditoria de specs/arreglos.md
      # encontro diez defectos con la suite en verde, y ninguno de los diez se
      # ve desde adentro de un paquete — todos viven en la costura entre
      # comandos.
      - name: El guion de humo, punta a punta
        working-directory: sf
        run: go test -tags e2e ./cmd/sf/

      # El mapa estado → skill es la costura entre el binario y skills/, y es la
      # única que ningún test de Go puede cubrir: `maquina.go` comprueba que los
      # nombres respeten la regla de prefijos, pero no que la carpeta exista.
      #
      # Ya se rompió una vez de la forma silenciosa (skills.md §12): un skill se
      # renombra, el binario compila, los tests pasan, y revienta en producción.
      #
      # Los nueve viven en `skills/maquina/`, y que estén AHÍ y no en otro bucket
      # lo comprueba un test de Go contra `maquina.SkillsDeEstado()`
      # (TestLaCarpetaMaquinaEsExactamenteLosNueve). Acá se comprueba la ruta,
      # que es lo que el plugin publica.
      - name: Los nueve skills del mapa existen
        run: |
          set -euo pipefail
          for s in sfp-scout sfp-po sfp-constitucion sfp-backlog sfp-roadmap \
                   sf-plan sf-build sf-check sf-cierre; do
            test -f "skills/maquina/$s/SKILL.md" \
              || { echo "falta skills/maquina/$s/SKILL.md"; exit 1; }
          done

      # NINGÚN nombre de modelo concreto puede vivir donde un MODELO lo lea.
      #
      # Es el invariante de H2, y es el chequeo más barato que existe contra la
      # forma exacta en que nació el "siempre opus": el ⑯ escribía `"modelo":
      # "opus"` porque era el ÚNICO ejemplo que veía en su propio skill. Un
      # default de un proveedor copiado a un skill, y de ahí a tareas.json, y de
      # ahí ejecutado en un harness que no lo entiende.
      #
      # Se mira en dos lugares y con dos varas distintas, y la diferencia es
      # quién es el lector:
      #
      #   skills/**.md   los lee un MODELO, que copia lo que ve   → cero tolerancia
      #   sf/**.go       fuera de los comentarios                 → cero tolerancia
      #
      # Los comentarios de Go quedan afuera a propósito: ahí es donde este
      # proyecto EXPLICA por qué ya no siembra nombres, y borrar esa explicación
      # para pasar un grep sería tirar la única memoria de por qué existe la
      # regla. Un comentario no lo lee el ⑯: lo lee quien vaya a tocar el código.
      - name: Ni un nombre de modelo donde un modelo lo lea
        run: |
          set -euo pipefail
          patron='\b(opus|sonnet|haiku|gpt-[0-9]|gemini|grok|deepseek-)'
          malo=0

          if grep -rniE "$patron" skills/ --include='*.md'; then
            echo "✗ Un SKILL.md nombra un modelo concreto. Eso es lo que el ⑯ copia."
            malo=1
          fi

          # En Go, sólo las líneas que NO son comentario.
          for f in $(find sf -name '*.go' ! -name '*_test.go' ! -path '*/migracion.go'); do
            if grep -vE '^\s*//' "$f" | grep -niE "$patron" | sed "s|^|$f:|" | grep .; then
              malo=1
            fi
          done

          if [ "$malo" -ne 0 ]; then
            echo
            echo "sf nombra PERFILES (razonar/construir/mecanico)."
            echo "Los nombres de modelo son de la máquina de Javier y viven sólo en su catálogo."
            exit 1
          fi

      # Y el `name:` del frontmatter tiene que coincidir con la carpeta: un
      # skill que se llama distinto de su directorio no lo encuentra nadie.
      - name: El name de cada skill coincide con su carpeta
        run: |
          set -euo pipefail
          # Se busca el SKILL.md y se sube un nivel: `skills/*/` son los
          # buckets (maquina · utiles · contrib), no los skills. Con el glob
          # viejo este chequeo no reventaba — recorría tres carpetas sin
          # SKILL.md y el grep fallaba por otra razón.
          find skills -name SKILL.md -print0 | while IFS= read -r -d '' f; do
            n="$(basename "$(dirname "$f")")"
            d="$(grep -m1 '^name:' "$f" | sed 's/^name: *//')"
            [ "$n" = "$d" ] || { echo "$f: carpeta=$n name=$d"; exit 1; }
          done

      # Los skills nombran comandos de sf, y eso es una PROMESA VERIFICABLE.
      # Este chequeo es el único del proyecto que cruza el .md con el binario —
      # ninguna compuerta lo hace, y por eso quedaron once punteros colgados a
      # comandos borrados hasta que se buscaron a mano.
      # Este chequeo era una lista negra de los comandos del producto viejo,
      # mantenida a mano. Envejecio como envejecen las listas a mano: `sf
      # doctor` figuraba como muerto el dia que se construyo de verdad.
      #
      # Lo reemplaza `TestLosSkillsDelRepoEstanAlineados`, que pregunta lo
      # contrario y no hay que mantener: en vez de enumerar lo que NO existe,
      # compara contra `comandos.Todos`, que es lo que si existe. Corre en el
      # paso "Ningun skill del repo nombra un comando que este binario no
      # tiene", mas abajo.

      # Los dos numeros del README envejecen callados: nadie los mira al agregar
      # un paquete o un test, y quedaron mintiendo por 7 paquetes y 66 tests
      # hasta que alguien los conto a mano. Compararlos cuesta tres lineas.
      - name: Los numeros del README son los de verdad
        run: |
          set -euo pipefail
          paquetes="$(ls -d sf/internal/*/ | wc -l | tr -d ' ')"
          tests="$(cd sf && go test ./... -count=1 -v 2>/dev/null | grep -cE '^ *--- PASS')"
          for f in README.md README.es.md; do
            grep -qE "$paquetes (packages|paquetes), $tests tests" "$f" || {
              echo "$f no dice \"$paquetes paquetes, $tests tests\":"
              grep -nE '(packages|paquetes), [0-9]+ tests' "$f"
              exit 1
            }
          done

      - name: Ningun skill usa la ruta vieja specforge/
        run: |
          set -euo pipefail
          if grep -rn 'specforge/' skills/; then
            echo "↑ la ruta es .docs/"
            exit 1
          fi

      # ────────────────────────────────────────────────────────────────────
      # El instalador
      # ────────────────────────────────────────────────────────────────────

      - name: install.sh es POSIX valido
        run: sh -n install.sh

      # `install.sh` arma el nombre del archivo que baja, y `release.yml` arma
      # el nombre del archivo que publica. Son dos lenguajes distintos en dos
      # maquinas distintas, asi que no hay forma de derivar uno del otro — pero
      # si no coinciden, el instalador cae al plan B (compilar) EN SILENCIO y
      # nadie se entera de que los releases no se usan.
      - name: El nombre del release es el que install.sh busca
        run: |
          set -euo pipefail
          # -F: son cadenas literales llenas de $ y {}, no patrones.
          grep -qF 'sf_${tag}_${PLATAFORMA}.${EXT}' install.sh || {
            echo "install.sh cambio como arma el nombre del archivo"; exit 1; }
          grep -qF 'sf_${TAG}_${p}.tar.gz' .github/workflows/release.yml || {
            echo "release.yml cambio como arma el nombre del tarball"; exit 1; }
          grep -qF 'sf_${TAG}_${p}.zip' .github/workflows/release.yml || {
            echo "release.yml cambio como arma el nombre del zip"; exit 1; }

      # Las cinco plataformas que publica el release tienen que ser las mismas
      # que `install.sh` sabe detectar. Una de menos y alguien recibe "no tengo
      # binario para tu maquina" cuando en realidad si lo hay.
      - name: Las plataformas del release y las que detecta install.sh coinciden
        run: |
          set -euo pipefail
          for p in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64; do
            grep -q "$p" .github/workflows/release.yml || {
              echo "release.yml no publica $p"; exit 1; }
          done

      # El doctor le pregunta a los skills instalados que comandos nombran, y
      # compara contra `comandos.Todos`. Aca se hace lo mismo contra los skills
      # DEL REPO: es el chequeo que le faltaba al CI cuando sfp-scout se
      # contradijo — se validaban los nombres y los comandos muertos, nunca lo
      # que el skill produce contra lo que la maquina acepta.
      - name: Ningun skill del repo nombra un comando que este binario no tiene
        working-directory: sf
        run: go test ./internal/doctor/ -run TestLosSkillsDelRepoEstanAlineados -count=1 -v
