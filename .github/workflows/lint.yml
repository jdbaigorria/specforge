name: ci

on:
  push:
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.x"
      - name: Vet
        working-directory: cli
        run: go vet ./...
      - name: Test
        working-directory: cli
        run: go test ./...
      - name: Build
        working-directory: cli
        run: go build -o sf .
      - name: Lint skill suite
        run: ./cli/sf lint
      - name: Example stays drift-clean
        run: ./cli/sf doctor examples/slugify

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Enforcement engine self-test
        run: python3 hooks/specforge_enforce.py --selftest
