# Docs site (D8'): mkdocs + material. Build: `pip install mkdocs-material && mkdocs serve`.
# Deploy a GitHub Pages: `mkdocs gh-deploy` (o el workflow de docs en CI).
site_name: SpecForge
site_description: Spec-driven development that is actually enforced — deterministic CLI + hooks + skills.
repo_url: https://github.com/jbaigorria/specforge
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Mental model: mental-model.md
  - Quickstart: quickstart.md
  - CLI & hooks: cli-and-hooks.md
  - Harness guarantees: harness-guarantees.md
  - Architecture: architecture.md
  - Skills reference: skills.md
  - Concepts: concepts.md
  - Walkthrough: walkthrough.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
